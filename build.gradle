plugins {
    id 'java'
    id 'pmd'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.avast.gradle.docker-compose' version '0.17.21'
}

group = 'com.ntnn'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    cucumberVersion = '7.30.0'
    deeplearning4jVersion = '1.0.0-M2.1'
}

pmd {
    toolVersion = '7.18.0'
    consoleOutput = true
    ruleSets = [
            'category/java/bestpractices.xml',
            'category/java/errorprone.xml'
    ]
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation "org.deeplearning4j:deeplearning4j-core:${deeplearning4jVersion}"
    implementation "org.nd4j:nd4j-native-platform:${deeplearning4jVersion}"
    implementation group: 'org.nd4j', name: 'nd4j-native', version: deeplearning4jVersion, classifier: 'macosx-arm64'
    runtimeOnly group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-aarch_64'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-spring:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    include '**/unitTest/**/*Test.class'
    exclude '**/blackboxTest/**'
    failOnNoDiscoveredTests = false
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('unitTest') {
    group = 'verification'
    description = 'Runs fast unit tests without starting Docker Compose.'
    dependsOn test
}

tasks.register('blackboxTest', Test) {
    group = 'verification'
    description = 'Runs Cucumber black-box behavior tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/blackboxTest/CucumberTest.class'
    shouldRunAfter test
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

dockerCompose {
    useComposeFiles = ['docker-compose.yml']
    startedServices = ['postgres', 'redis']
    waitForTcpPorts = true
    captureContainersOutput = true
}
check.dependsOn tasks.named('blackboxTest')
